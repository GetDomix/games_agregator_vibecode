# Игроскан (Igroscan) — shared/local Laravel + React + PostgreSQL base.
# Public edge services are opt-in profiles; production requires the strict overlay.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpa}
      POSTGRES_USER: ${POSTGRES_USER:-gpa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpa_secret_change_me}
    volumes:
      - gpa_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpa} -d ${POSTGRES_DB:-gpa}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8000"
    # Host /opt/gpa/.env is the source of truth for APP_KEY + DB password.
    # Do not export empty APP_KEY/POSTGRES_PASSWORD in the shell before `compose up`
    # (empty shell vars override the project .env file).
    env_file:
      - .env
    environment:
      APP_NAME: Игроскан
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://127.0.0.1:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:5173}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-gpa}
      DB_USERNAME: ${POSTGRES_USER:-gpa}
      # Map POSTGRES_* from project .env → Laravel DB_* (same file via env_file also sets POSTGRES_*)
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gpa_secret_change_me}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-120}
      RUN_MIGRATIONS: "true"
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,127.0.0.1,localhost:5173,127.0.0.1:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      DIGISELLER_PARTNER_ID: ${DIGISELLER_PARTNER_ID:-}
      ADS_ENABLED: ${ADS_ENABLED:-true}
      ADS_CONTACT_EMAIL: ${ADS_CONTACT_EMAIL:-ads@example.com}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
      PLATI_MAX_PAGES: ${PLATI_MAX_PAGES:-5}
      PLATI_PAGE_SIZE: ${PLATI_PAGE_SIZE:-100}
      GGSEL_LIMIT: ${GGSEL_LIMIT:-100}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      RADAR_SERVICE_TOKEN: ${RADAR_SERVICE_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    # Internal only — public traffic goes through Caddy (80/443)
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-gpa}
      DB_USERNAME: ${POSTGRES_USER:-gpa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gpa_secret_change_me}
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan queue:work database --queue=prices,default --sleep=1 --tries=3 --max-time=3600
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-gpa}
      DB_USERNAME: ${POSTGRES_USER:-gpa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gpa_secret_change_me}
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-120}
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: [edge]
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # Free Cloudflare edge access WITHOUT buying a domain (temporary *.trycloudflare.com URL).
  # Traffic goes via Cloudflare anycast → often works without VPN when bare IP is filtered.
  # Permanent custom hostname still needs any domain on a free Cloudflare plan.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
    restart: unless-stopped

  # Telegram interface (aiogram3) — polling only; Laravel owns refresh scheduling
  radar-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-igroscan_radar_bot}
      API_BASE_URL: http://backend:8000
      RADAR_SERVICE_TOKEN: ${RADAR_SERVICE_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles: [telegram]

volumes:
  gpa_pgdata:
  caddy_data:
  caddy_config:
