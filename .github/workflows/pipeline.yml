name: Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the verified revision to production
        required: true
        default: false
        type: boolean

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 1 · Backend (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gpa_test
          POSTGRES_USER: gpa
          POSTGRES_PASSWORD: gpa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpa -d gpa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, pgsql, zip, tokenizer, xml, ctype, json, bcmath
          coverage: none
      - name: Install Composer deps
        run: |
          cp .env.example .env
          # skip artisan scripts until key + DB env exist
          composer install --no-interaction --prefer-dist --no-scripts
          php artisan key:generate --force
          composer dump-autoload -o
          php artisan package:discover --ansi
      - name: Audit locked Composer dependencies
        run: composer audit --locked --no-interaction
      - name: Configure env (PostgreSQL)
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=gpa_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=gpa/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=gpa/' .env
      - name: Migrate
        run: php artisan migrate --force
      - name: Feature smoke (health + register)
        run: |
          php artisan serve --host=127.0.0.1 --port=8080 &
          sleep 3
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -X POST http://127.0.0.1:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{"email":"ci@test.local","password":"password1","display_name":"CI"}'
      - name: PHPUnit
        shell: bash
        run: |
          set +e
          php artisan test 2>&1 | tee /tmp/phpunit.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            details=$(tail -n 80 /tmp/phpunit.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=PHPUnit failed::$details"
          fi

          exit "$status"

  frontend-build:
    name: 2 · Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build

  bot-test:
    name: 3 · Telegram bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

  infrastructure-check:
    name: 4 · Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret Compose environment
        run: cp backend/.env.example .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Validate strict production template
        run: PREFLIGHT_TEST_COMPOSE=1 ./deploy/tests/production-preflight-test.sh
      - name: Build application images
        run: docker compose build backend frontend scheduler queue-worker radar-bot

  deploy:
    name: 5 · Deploy VPS
    needs: [backend-test, frontend-build, bot-test, infrastructure-check]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production == true &&
      vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: mkdir -p ~/.ssh && ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Rsync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/gpa' }}
        run: |
          ssh -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          rsync -az --delete \
            -e "ssh -p $DEPLOY_PORT" \
            --exclude '.git/' --exclude 'node_modules/' --exclude 'backend/vendor/' \
            --exclude 'legacy/' --exclude '.venv/' --exclude 'data/' --exclude 'backups/' \
            --exclude 'backend/.env' --exclude '.env' --exclude 'deploy/.env.production' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
      - name: Strict preflight, backup and Compose up
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/gpa' }}
        run: |
          ssh -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            env DEPLOY_PATH="$DEPLOY_PATH" \
            bash -s <<'EOS'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          production_env=deploy/.env.production
          test -f "$production_env"
          chmod 600 "$production_env"
          ./deploy/preflight-production.sh "$production_env"

          export PRODUCTION_ENV_FILE="$production_env"
          compose=(docker compose --env-file "$production_env" -f docker-compose.yml -f compose.production.yml)
          mkdir -p backups

          if "${compose[@]}" ps --status running --services | grep -qx db; then
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup="backups/igroscan-${stamp}.dump"
            umask 077
            "${compose[@]}" exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$backup"
            test -s "$backup"
            "${compose[@]}" exec -T db sh -c 'pg_restore --list' < "$backup" >/dev/null
          fi

          "${compose[@]}" up -d --build --remove-orphans
          "${compose[@]}" ps

          for service in backend scheduler queue-worker frontend caddy; do
            "${compose[@]}" ps --status running --services | grep -qx "$service" || {
              echo "service is not running: $service" >&2
              exit 1
            }
          done
          "${compose[@]}" exec -T backend php artisan schedule:list
          EOS
      - name: HTTPS health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/gpa' }}
        run: |
          APP_DOMAIN="$(ssh -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "awk -F= '\$1 == \"APP_DOMAIN\" { print substr(\$0, index(\$0, \"=\") + 1) }' '${DEPLOY_PATH}/deploy/.env.production'")"
          test -n "$APP_DOMAIN"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            "https://${APP_DOMAIN}/api/health"
